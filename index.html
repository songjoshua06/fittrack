<title>FitTrack</title>
<style>
/* Layout: single centered phone column — fixed header + scrolling view + fixed bottom nav; overlays for timer and custom-exercise. */
:root{
  --bg:#060709; --app:#0C0D10; --surface:#16181D; --surface2:#1E2127; --line:#2A2D35;
  --fg:#F4F5F7; --muted:#A1A4AD; --faint:#6E7079; --accent:#D6FB5A; --accent-ink:#0C0D10;
  --danger:#FF7A7A; --good:#D6FB5A;
  --display:ui-rounded,'SF Pro Rounded',-apple-system,system-ui,'Segoe UI',Roboto,sans-serif;
  --body:-apple-system,system-ui,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{font-family:inherit;color:inherit}
input,select{font-family:inherit}
::-webkit-scrollbar{width:0;height:0}
.app{max-width:480px;margin:0 auto;height:100%;background:var(--app);display:flex;flex-direction:column;position:relative;overflow:hidden}
.view{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.pad{padding:0 20px}
.hidden{display:none!important}

/* header */
.hdr{padding:calc(env(safe-area-inset-top,0px) + 18px) 20px 10px}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.14em;color:var(--muted)}
.h1{font-family:var(--display);font-size:29px;font-weight:700;letter-spacing:-.01em;margin:2px 0 0}
.h-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}

/* buttons */
.btn{border:none;border-radius:14px;padding:14px;font-family:var(--display);font-weight:700;font-size:16px;cursor:pointer;width:100%}
.btn-accent{background:var(--accent);color:var(--accent-ink)}
.btn-ghost{background:var(--surface2);border:1px solid var(--line);color:var(--fg);font-weight:700}
.btn-sm{padding:9px 14px;border-radius:11px;font-size:14px;width:auto}
.chip{background:var(--surface2);border:1px solid var(--line);color:var(--muted);font-size:13px;font-weight:700;padding:8px 13px;border-radius:10px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.row{display:flex;align-items:center;gap:10px}
.spread{display:flex;align-items:center;justify-content:space-between;gap:10px}
.mut{color:var(--muted);font-weight:600}
.faint{color:var(--faint)}
.tag{background:var(--surface2);color:#9BA0A9;font-size:10.5px;font-weight:800;letter-spacing:.03em;padding:3px 7px;border-radius:6px}
.sec{font-size:12px;font-weight:800;letter-spacing:.1em;color:var(--faint);margin:20px 2px 10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px}
.icon-btn{background:var(--surface2);border:1px solid var(--line);color:var(--fg);width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.circle-btn{width:40px;height:40px;border-radius:50%;background:var(--accent);color:var(--accent-ink);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
svg{display:block}
.num{font-family:var(--display);font-variant-numeric:tabular-nums}

/* bottom nav */
.nav{display:flex;align-items:center;justify-content:space-around;background:rgba(12,13,16,.95);border-top:1px solid #20222A;padding:10px 8px calc(env(safe-area-inset-bottom,0px) + 14px)}
.nav button{background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;color:var(--faint);padding:2px 10px}
.nav button.on{color:var(--accent)}
.nav span{font-size:10.5px;font-weight:700}

/* library */
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.search input{flex:1;background:none;border:none;outline:none;color:var(--fg);font-size:15px;font-weight:600;min-width:0}
.filtrow{display:flex;gap:8px;overflow-x:auto;padding:12px 20px 2px}
.exli{width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:9px;display:flex;align-items:center;gap:13px;cursor:pointer}
.exli .ic{width:44px;height:44px;border-radius:12px;background:var(--surface2);display:flex;align-items:center;justify-content:center;flex:none;color:var(--accent)}
.exli .nm{font-weight:700;font-size:15px}
.exli .tags{display:flex;gap:5px;margin-top:5px;flex-wrap:wrap}

/* session set rows */
.setgrid{display:grid;grid-template-columns:26px 1fr 1fr 42px;align-items:center;gap:6px}
.setgrid .lab{font-size:10.5px;font-weight:800;letter-spacing:.06em;color:var(--faint);text-align:center}
.setinput{width:100%;background:var(--app);border:1px solid var(--line);border-radius:10px;padding:9px 6px;color:var(--fg);text-align:center;font-family:var(--display);font-weight:700;font-size:16px;outline:none}
.setinput:focus{border-color:var(--accent)}
.setrow{padding:6px 0}
.setrow.done .setinput{border-color:rgba(214,251,90,.4);background:rgba(214,251,90,.07)}
.check{width:40px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);color:var(--faint);display:flex;align-items:center;justify-content:center;cursor:pointer}
.check.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.setno{font-weight:800;color:var(--muted);text-align:center}

/* overlays */
.overlay{position:absolute;inset:0;background:var(--app);display:flex;flex-direction:column;z-index:30}
.ov-head{display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 16px) 20px 8px}
.ov-body{flex:1;overflow-y:auto;padding:0 20px calc(env(safe-area-inset-bottom,0px) + 24px)}

/* timer */
.ring-wrap{position:relative;width:224px;height:224px;margin:8px auto 0}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-time{font-family:var(--display);font-size:52px;font-weight:700;line-height:1}
.ring-lab{font-size:11px;font-weight:800;letter-spacing:.18em;color:var(--muted);margin-top:4px}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:4px}
.key{background:var(--surface2);border:none;color:var(--fg);border-radius:12px;padding:14px 0;font-family:var(--display);font-size:22px;font-weight:600;cursor:pointer}
.key.minor{background:transparent;color:var(--muted);font-size:14px;font-weight:700;font-family:var(--body)}
.tctl{width:56px;height:56px;border-radius:50%;background:var(--surface2);border:1px solid var(--line);color:var(--fg);font-size:11px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center}
.tctl.big{width:70px;height:70px;background:var(--accent);color:var(--accent-ink);border:none}

/* floating rest bar */
.restbar{position:absolute;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 90px);background:var(--accent);border-radius:16px;padding:12px 14px 12px 18px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 12px 30px rgba(0,0,0,.5);z-index:20;max-width:448px;margin:0 auto}
.restbar .num{color:var(--accent-ink);font-size:26px;font-weight:700;line-height:1}

/* forms */
.field{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;color:var(--fg);font-size:15px;font-weight:600;outline:none}
.field:focus{border-color:var(--accent)}
.toggle{width:50px;height:30px;border-radius:15px;background:var(--surface2);border:1px solid var(--line);position:relative;flex:none;cursor:pointer}
.toggle .knob{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--muted);transition:all .15s}
.toggle.on{background:var(--accent);border-color:var(--accent)}
.toggle.on .knob{left:auto;right:3px;background:var(--accent-ink)}
.seg{display:flex;gap:8px}
.seg .opt{flex:1;text-align:center;background:var(--surface);border:1px solid var(--line);color:var(--muted);font-size:13px;font-weight:700;padding:11px 0;border-radius:12px;cursor:pointer}
.seg .opt.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.photo-pick{display:flex;flex-direction:column;align-items:center;gap:10px;background:var(--surface);border:1px dashed #3A3D45;border-radius:18px;padding:20px;cursor:pointer;text-align:center}
.photo-pick img{width:100%;max-width:220px;border-radius:12px;aspect-ratio:16/10;object-fit:cover}
.savebar{padding:14px 20px calc(env(safe-area-inset-bottom,0px) + 22px);background:linear-gradient(to top,var(--app) 70%,transparent)}
.empty{text-align:center;color:var(--muted);padding:40px 20px;font-weight:600}
.pr{background:rgba(214,251,90,.15);color:var(--accent);font-size:10.5px;font-weight:800;padding:3px 7px;border-radius:6px}
a{color:var(--accent)}
.toast{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 96px);background:var(--fg);color:var(--app);font-weight:800;font-size:13px;padding:10px 16px;border-radius:12px;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.4)}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
@media (prefers-reduced-motion:reduce){#restbar{animation:none!important}}
</style>
</head>

/* ---------- state + persistence ---------- */
const LS='fittrack.v2';
function daysAgo(n){const d=new Date();d.setHours(10,0,0,0);d.setDate(d.getDate()-n);return d.toISOString();}
function seedHistory(){
  const mk=(dISO,exId,sets)=>({id:uid(),date:dISO,name:'Workout',items:[{exId,sets:sets.map(s=>({kg:s[0],reps:s[1]}))}]});
  return [
    mk(daysAgo(42),'bb-bench',[[40,8],[40,8],[40,7]]),
    mk(daysAgo(35),'bb-bench',[[42.5,8],[42.5,7]]),
    mk(daysAgo(28),'bb-bench',[[45,6],[45,5]]),
    mk(daysAgo(21),'bb-bench',[[45,7],[45,6]]),
    mk(daysAgo(14),'bb-bench',[[47.5,5],[47.5,4]]),
    mk(daysAgo(7),'bb-bench',[[50,3],[47.5,5]]),
    mk(daysAgo(30),'back-squat',[[70,5],[70,5]]),
    mk(daysAgo(16),'back-squat',[[80,5],[80,4]]),
    mk(daysAgo(5),'back-squat',[[85,5],[85,5]])
  ];
}
function defaultState(){
  return {
    unit:'kg', defaultRest:90, restByEx:{}, view:'home', sample:true,
    custom:[],
    templates:[
      {id:uid(),name:'Push Day',ex:['bb-bench','inc-db-press','machine-press','db-lateral','cable-lateral','tri-pushdown']},
      {id:uid(),name:'Pull Day',ex:['deadlift','bb-row','lat-pulldown','cable-row','db-curl','face-pull']},
      {id:uid(),name:'Leg Day',ex:['back-squat','leg-press','rdl','leg-curl','calf-raise']}
    ],
    history:seedHistory(),
    active:null
  };
}
function uid(){return 'x'+Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);}
let S;
function load(){try{const r=localStorage.getItem(LS);if(r)return JSON.parse(r);}catch(e){}return null;}
function save(){try{localStorage.setItem(LS,JSON.stringify(S));return true;}catch(e){return false;}}
function downscaleImage(file,maxDim,cb){const rd=new FileReader();rd.onload=function(){const img=new Image();img.onload=function(){let w=img.width,h=img.height;const sc=Math.min(1,maxDim/Math.max(w,h));const cw=Math.max(1,Math.round(w*sc)),ch=Math.max(1,Math.round(h*sc));const c=document.createElement('canvas');c.width=cw;c.height=ch;c.getContext('2d').drawImage(img,0,0,cw,ch);let out;try{out=c.toDataURL('image/jpeg',0.72);}catch(e){out=rd.result;}cb(out);};img.onerror=function(){cb(rd.result);};img.src=rd.result;};rd.onerror=function(){cb(null);};rd.readAsDataURL(file);}
function todayDateStr(){const d=new Date();const o=d.getTimezoneOffset();return new Date(d.getTime()-o*60000).toISOString().slice(0,10);}
S=load()||defaultState();
S.bodyweight=S.bodyweight||[];
S.custom=S.custom||[];
S.restByEx=S.restByEx||{};

/* ---------- helpers ---------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function allEx(){return SEED.concat(S.custom||[]);}
function exById(id){return allEx().find(e=>e.id===id);}
function unitLabel(){return S.unit;}
function kgToDisp(kg){if(kg==null||kg==='')return '';return S.unit==='kg'?kg:Math.round(kg*2.20462*10)/10;}
function dispToKg(v){v=parseFloat(v);if(isNaN(v))return null;return S.unit==='kg'?v:Math.round(v/2.20462*100)/100;}
function fmt(n){if(n==null||isNaN(n))return '0';return String(parseFloat(Number(n).toFixed(2)));}
function fmtW(kg){return fmt(kgToDisp(kg));}
function e1rm(kg,reps){return kg*(1+reps/30);}
function fmtTime(sec){sec=Math.max(0,Math.round(sec));const m=Math.floor(sec/60),s=sec%60;return m+':'+String(s).padStart(2,'0');}
function fmtDate(iso){const d=new Date(iso);return d.toLocaleDateString(undefined,{month:'short',day:'numeric'});}
function lastEntryFor(exId){for(let i=S.history.length-1;i>=0;i--){const it=S.history[i].items.find(x=>x.exId===exId);if(it)return {date:S.history[i].date,sets:it.sets};}return null;}
function setsSummary(sets){return sets.map(s=>fmtW(s.kg)+'×'+s.reps).join(', ');}
function restForEx(exId){return (S.restByEx&&S.restByEx[exId])||S.defaultRest;}
function toast(msg){let t=document.getElementById('toast');if(t)t.remove();t=document.createElement('div');t.className='toast';t.id='toast';t.textContent=msg;document.getElementById('app').appendChild(t);setTimeout(()=>{if(t)t.remove();},1800);}

/* ---------- PROGRESS ---------- */
function chartSVG(points){
  // points: [{date, kg, reps}]
  const W=324,H=176,pL=28,pR=14,pT=16,pB=26;
  if(points.length<2){return '<div class="empty">Log this exercise at least twice to see progress.</div>';}
  const kgs=points.map(p=>p.kg);
  let min=Math.min.apply(null,kgs),max=Math.max.apply(null,kgs);
  if(min===max){min=min-5;max=max+5;}
  const pad=(max-min)*0.15||1;min-=pad;max+=pad;
  const xs=i=>pL+(W-pL-pR)*(points.length===1?0.5:i/(points.length-1));
  const ys=kg=>pT+(H-pT-pB)*(1-(kg-min)/(max-min));
  let line=points.map((p,i)=>(i?'L':'M')+xs(i).toFixed(1)+','+ys(p.kg).toFixed(1)).join(' ');
  let area=line+' L'+xs(points.length-1).toFixed(1)+','+(H-pB)+' L'+xs(0).toFixed(1)+','+(H-pB)+' Z';
  let grid='';
  [max- pad*0.3, (min+max)/2, min+pad*0.3].forEach(v=>{const y=ys(v).toFixed(1);grid+='<line x1="'+pL+'" y1="'+y+'" x2="'+(W-pR)+'" y2="'+y+'" stroke="#23252C" stroke-width="1"/>';});
  let dots=points.map((p,i)=>{const last=i===points.length-1;return '<circle cx="'+xs(i).toFixed(1)+'" cy="'+ys(p.kg).toFixed(1)+'" r="'+(last?5:3.4)+'" fill="'+(last?'#D6FB5A':'#0C0D10')+'" stroke="#D6FB5A" stroke-width="2.2"/>';}).join('');
  let ylabs='<text x="4" y="'+(ys(max-pad*0.3)+4).toFixed(1)+'" fill="#6E7079" font-size="10" font-family="ui-rounded, system-ui, sans-serif">'+fmt(kgToDisp(max-pad*0.3))+'</text>'+
            '<text x="4" y="'+(ys(min+pad*0.3)+4).toFixed(1)+'" fill="#6E7079" font-size="10" font-family="ui-rounded, system-ui, sans-serif">'+fmt(kgToDisp(min+pad*0.3))+'</text>';
  const idxs=points.length<=4?points.map((_,i)=>i):[0,Math.floor((points.length-1)/2),points.length-1];
  let xlabs=idxs.map(i=>{const anchor=i===0?'start':(i===points.length-1?'end':'middle');return '<text x="'+xs(i).toFixed(1)+'" y="'+(H-8)+'" fill="#6E7079" font-size="10" text-anchor="'+anchor+'" font-family="system-ui, sans-serif">'+fmtDate(points[i].date)+'</text>';}).join('');
  return '<svg width="100%" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Weight per session over time" style="overflow:visible">'+

function progressPoints(exId){
  const pts=[];
  S.history.forEach(h=>{const it=h.items.find(x=>x.exId===exId);if(it&&it.sets.length){let best=it.sets[0];it.sets.forEach(s=>{if(s.kg>best.kg||(s.kg===best.kg&&s.reps>best.reps))best=s;});pts.push({date:h.date,kg:best.kg,reps:best.reps,vol:it.sets.reduce((a,s)=>a+s.kg*s.reps,0)});}});
  return pts;
}
function renderProgress(){
  const exsWithData=allEx().filter(e=>S.history.some(h=>h.items.some(x=>x.exId===e.id)));
  if(!exsWithData.find(e=>e.id===progSel)&&exsWithData.length)progSel=exsWithData[0].id;
  let h='<div class="hdr"><div class="eyebrow">PROGRESS</div>'+
    '<select id="progsel" data-act="prog-sel" class="field" style="margin-top:4px;font-family:var(--display);font-weight:700;font-size:20px;padding:10px 12px;-webkit-appearance:none;appearance:none;background-image:none">'+
    (exsWithData.length?exsWithData.map(e=>'<option value="'+e.id+'"'+(e.id===progSel?' selected':'')+'>'+esc(e.name)+'</option>').join(''):'<option>No data yet</option>')+
    '</select></div>';
  h+='<div class="pad" style="padding-bottom:110px">';
  if(!exsWithData.length){h+='<div class="empty">Finish a workout and your lifts will chart here automatically — weight per session, with dates.</div></div>';return h;}
  const pts=progressPoints(progSel);
  const best=pts.reduce((b,p)=>!b||p.kg>b.kg||(p.kg===b.kg&&p.reps>b.reps)?p:b,null);
  const first=pts[0],last=pts[pts.length-1];
  const delta=pts.length>1?(last.kg-first.kg):0;
  const maxVol=pts.reduce((m,p)=>Math.max(m,p.vol),0);
  const est=best?e1rm(best.kg,best.reps):0;
  h+='<div class="card" style="padding:18px 16px 12px;margin-top:8px">'+
    '<div class="spread" style="align-items:flex-end;margin-bottom:8px"><div>'+
    '<div class="num" style="font-size:30px;font-weight:700;line-height:1">'+fmtW(best?best.kg:0)+'<span class="mut" style="font-size:15px"> '+unitLabel()+'</span></div>'+
    '<div class="mut" style="font-size:12px;margin-top:2px">heaviest set'+(delta?' · '+(delta>0?'+':'')+fmt(kgToDisp(Math.abs(delta))*(delta<0?-1:1))+' '+unitLabel():'')+'</div></div>'+
    (delta>0?'<div class="row" style="gap:4px;color:var(--accent);font-size:13px;font-weight:800">'+svg('up',15,2.6)+Math.round(delta/Math.max(first.kg,1)*100)+'%</div>':'')+
    '</div>'+chartSVG(pts)+'</div>';
  h+='<div class="row" style="gap:10px;margin-top:14px;align-items:stretch">'+
    '<div class="card" style="flex:1;padding:13px 14px"><div class="sec" style="margin:0 0 4px">EST. 1RM</div><div class="num" style="font-size:21px;font-weight:700">~'+fmtW(est)+' '+unitLabel()+'</div></div>'+
    '<div class="card" style="flex:1;padding:13px 14px"><div class="sec" style="margin:0 0 4px">BEST VOLUME</div><div class="num" style="font-size:21px;font-weight:700">'+fmt(Math.round(kgToDisp(maxVol)))+' '+unitLabel()+'</div></div></div>';
  h+='<div class="sec">HISTORY</div>';
  const rows=S.history.filter(hi=>hi.items.some(x=>x.exId===progSel)).slice().reverse();
  rows.forEach((hi,ri)=>{
    const it=hi.items.find(x=>x.exId===progSel);
    const vol=it.sets.reduce((a,s)=>a+s.kg*s.reps,0);
    const d=new Date(hi.date);
    const isPR=best&&it.sets.some(s=>s.kg===best.kg&&s.reps===best.reps)&&ri===0;
    h+='<div class="card" style="padding:12px 15px;margin-bottom:8px;display:flex;align-items:center;gap:13px">'+
      '<div style="display:flex;flex-direction:column;align-items:center;width:40px;flex:none"><span class="num" style="font-size:18px;font-weight:700;line-height:1">'+d.getDate()+'</span><span class="faint" style="font-size:10px;font-weight:800;letter-spacing:.05em">'+d.toLocaleDateString(undefined,{month:'short'}).toUpperCase()+'</span></div>'+
      '<div style="width:1px;align-self:stretch;background:var(--line)"></div>'+
      '<div style="flex:1;min-width:0"><div style="font-family:var(--display);font-weight:700;font-size:15px">'+esc(setsSummary(it.sets))+'</div>'+
      '<div class="mut" style="font-size:11.5px;margin-top:1px">volume '+fmt(Math.round(kgToDisp(vol)))+' '+unitLabel()+'</div></div>'+
      (isPR?'<span class="pr">PR</span>':'')+'</div>';
  });
  h+='</div>';
  return h;
}

/* ---------- actions ---------- */
function startEmpty(){S.active={name:'Workout',startedAt:Date.now(),items:[]};S.view='session';save();render();}
function startTemplate(t){S.active={name:t.name,startedAt:Date.now(),items:t.ex.map(id=>({exId:id,sets:[blankSet(),blankSet(),blankSet()]}))};S.view='session';save();render();}
function blankSet(){return {kg:null,reps:null,done:false};}
function addExerciseToSession(exId){const e=exById(exId);const def=(e&&e.trackBy==='time')?[{kg:null,reps:null,done:false}]:[blankSet(),blankSet(),blankSet()];S.active.items.push({exId,sets:def});save();}
function finishSession(){
  const a=S.active;
  const items=a.items.map(it=>({exId:it.exId,sets:it.sets.filter(s=>s.done&&s.reps!=null).map(s=>({kg:s.kg==null?0:s.kg,reps:s.reps}))})).filter(it=>it.sets.length);
  if(items.length){S.history.push({id:uid(),date:new Date().toISOString(),name:a.name,items});}

/* ---------- TIMER ---------- */
let timer={total:90,remaining:90,running:false,endAt:0,iv:null,typed:'',visible:false,audio:null,done:false,alarmIv:null,keep:null,sched:null};
let wakeLock=null;
async function requestWake(){try{if('wakeLock' in navigator){wakeLock=await navigator.wakeLock.request('screen');}}catch(e){}}
function releaseWake(){try{if(wakeLock){wakeLock.release();wakeLock=null;}}catch(e){}}
function requestNotify(){try{if('Notification' in window && Notification.permission==='default'){Notification.requestPermission().catch(function(){});}}catch(e){}}
function notifyDone(){try{if('Notification' in window && Notification.permission==='granted'){new Notification('Rest complete',{body:'Time for your next set.',tag:'fittrack-rest'});}}catch(e){}}
function alarm(){stopAlarm();beep();let n=0;timer.alarmIv=setInterval(function(){n++;if(n>=4){stopAlarm();return;}beep();},2500);}
function stopAlarm(){if(timer.alarmIv){clearInterval(timer.alarmIv);timer.alarmIv=null;}}
function timerDone(){
  if(timer.done)return;
  timer.done=true;timer.running=false;clearInterval(timer.iv);timer.remaining=0;
  releaseWake();disarmBackgroundAlarm();alarm();notifyDone();
  try{if(navigator.vibrate)navigator.vibrate([400,150,400,150,500]);}catch(e){}
  toast('Rest over — start your next set');
  updateTimerUI();renderRestBar();
}
function timerStartTick(){
  clearInterval(timer.iv);
  timer.endAt=Date.now()+timer.remaining*1000;
  timer.iv=setInterval(()=>{
    const rem=(timer.endAt-Date.now())/1000;
    timer.remaining=Math.max(0,rem);
    if(rem<=0){timer.remaining=0;timerDone();}
    updateTimerUI();renderRestBar();
  },200);
}
function ensureAudio(){try{if(!timer.audio)timer.audio=new (window.AudioContext||window.webkitAudioContext)();if(timer.audio.state==='suspended')timer.audio.resume().catch(function(){});}catch(e){}return timer.audio;}
function beep(){const ctx=ensureAudio();if(!ctx)return;[0,0.22,0.44].forEach(t=>{try{const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=880;o.connect(g);g.connect(ctx.destination);const s=ctx.currentTime+t;g.gain.setValueAtTime(0.0001,s);g.gain.exponentialRampToValueAtTime(0.4,s+0.01);g.gain.exponentialRampToValueAtTime(0.0001,s+0.18);o.start(s);o.stop(s+0.2);}catch(e){}});}
/* keep the audio session alive so a scheduled alarm can still ring while the app is backgrounded (best within ~3 min) */
function startKeepAlive(){const ctx=ensureAudio();if(!ctx)return;stopKeepAlive();try{const o=ctx.createOscillator(),g=ctx.createGain();g.gain.value=0.0001;o.frequency.value=30;o.connect(g);g.connect(ctx.destination);o.start();timer.keep={o:o,g:g};}catch(e){}}
function stopKeepAlive(){if(timer.keep){try{timer.keep.o.stop();timer.keep.o.disconnect();timer.keep.g.disconnect();}catch(e){}timer.keep=null;}}
/* schedule the alarm tones on the audio clock for exactly `sec` from now */
function scheduleAlarm(sec){const ctx=ensureAudio();if(!ctx)return;cancelScheduled();const base=ctx.currentTime+Math.max(0,sec);timer.sched=[];for(let b=0;b<6;b++){const t0=base+b*0.6;[0,0.18].forEach(dt=>{try{const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=880;o.connect(g);g.connect(ctx.destination);const t=t0+dt;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.4,t+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t+0.15);o.start(t);o.stop(t+0.18);timer.sched.push(o);}catch(e){}});}}
function cancelScheduled(){if(timer.sched){timer.sched.forEach(function(o){try{o.stop();o.disconnect();}catch(e){}});timer.sched=null;}}
function armBackgroundAlarm(){ensureAudio();startKeepAlive();scheduleAlarm(timer.remaining);}
function disarmBackgroundAlarm(){cancelScheduled();stopKeepAlive();}
function startRest(sec){stopAlarm();timer.done=false;timer.total=sec;timer.remaining=sec;timer.running=true;timer.visible=true;requestNotify();requestWake();timerStartTick();armBackgroundAlarm();updateTimerUI();renderRestBar();}
function openTimer(){
  if(!timer.visible){timer.total=S.defaultRest;timer.remaining=S.defaultRest;}
  timer.typed='';

}
function closeTimer(){document.getElementById('timerOv').classList.add('hidden');}
function timerHTML(){

    '<div class="ov-body" style="display:flex;flex-direction:column">'+

      '<div class="spread" style="margin-bottom:12px"><span class="sec" style="margin:0">TYPE A TIME</span><span class="num" id="typedDisp" style="font-size:22px;font-weight:700;letter-spacing:.04em">'+typedFmt()+'</span></div>'+
      '<div class="keypad">'+
        [1,2,3,4,5,6,7,8,9].map(n=>'<button class="key" data-act="timer-key" data-v="'+n+'">'+n+'</button>').join('')+
        '<button class="key minor" data-act="timer-key" data-v="00">00</button>'+
        '<button class="key" data-act="timer-key" data-v="0">0</button>'+
        '<button class="key minor" data-act="timer-del" aria-label="Delete">⌫</button>'+
      '</div>'+
      '<button class="btn btn-accent" data-act="timer-use" style="margin-top:12px">Start this time</button>'+
    '</div></div>';
}
function typedSeconds(){const t=timer.typed.padStart(4,'0').slice(-4);const mm=parseInt(t.slice(0,2),10),ss=parseInt(t.slice(2),10);return mm*60+ss;}
function typedFmt(){const t=timer.typed.padStart(4,'0').slice(-4);return t.slice(0,2)+':'+t.slice(2);}
function updateTimerUI(){
  const rt=document.getElementById('ringTime');if(rt)rt.textContent=fmtTime(timer.remaining);
  const rl=document.getElementById('ringLab');if(rl)rl.textContent=timer.remaining<=0?'DONE':(timer.running?'RUNNING':'PAUSED');
  const rp=document.getElementById('ringProg');if(rp){const frac=timer.total>0?Math.max(0,timer.remaining/timer.total):0;rp.setAttribute('stroke-dashoffset',(729*(1-frac)).toFixed(1));}
  const tp=document.getElementById('tPlay');if(tp)tp.innerHTML=timer.running?pauseSvg(26):playSvg(26);

function renderRestBar(){
  let bar=document.getElementById('restbar');

        '<button data-act="rest-dismiss" style="background:var(--accent-ink);border:none;color:var(--accent);border-radius:12px;padding:12px 18px;font-weight:800;font-size:14px;cursor:pointer">Done</button>';
    }else{
      bar.style.animation='';
      bar.innerHTML='<div style="display:flex;flex-direction:column"><span style="color:var(--accent-ink);font-size:11px;font-weight:800;letter-spacing:.1em;opacity:.6">REST</span><span class="num">'+fmtTime(timer.remaining)+'</span></div>'+
        '<div class="row" style="gap:8px">'+
        '<button data-act="timer-add15" style="background:rgba(12,13,16,.12);border:none;color:var(--accent-ink);border-radius:11px;padding:9px 12px;font-weight:800;font-size:13px;cursor:pointer">+15s</button>'+
        '<button data-act="rest-toggle" style="background:var(--accent-ink);border:none;color:var(--accent);width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;cursor:pointer" aria-label="'+(timer.running?'Pause':'Resume')+'">'+(timer.running?pauseSvg(18):playSvg(18))+'</button>'+
        '<button data-act="rest-open" style="background:var(--accent-ink);border:none;color:var(--accent);width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;cursor:pointer" aria-label="Open timer">'+svg('clock',18,2)+'</button>'+
        '<button data-act="rest-dismiss" style="background:rgba(12,13,16,.12);border:none;color:var(--accent-ink);width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;cursor:pointer" aria-label="Dismiss">'+svg('x',18,2)+'</button>'+
        '</div>';
    }
  }else if(bar){bar.remove();}
}

/* ---------- CUSTOM EXERCISE ---------- */
let draft={name:'',body:'Chest',equip:'Barbell',uni:false,trackBy:'weight',photo:null};
function openCustom(){draft={name:'',body:'Chest',equip:'Barbell',uni:false,trackBy:'weight',photo:null};const ov=document.getElementById('customOv');ov.innerHTML=customHTML();ov.classList.remove('hidden');}
function closeCustom(){document.getElementById('customOv').classList.add('hidden');}
function customHTML(){
  return '<div class="ov-head"><button data-act="custom-close" style="background:none;border:none;color:var(--muted);font-weight:600;font-size:15px;cursor:pointer">Cancel</button>'+
    '<div style="font-family:var(--display);font-weight:700;font-size:17px">New exercise</div><span style="width:52px"></span></div>'+
    '<div class="ov-body">'+
    '<label class="photo-pick" style="margin-top:6px">'+
      (draft.photo?'<img src="'+draft.photo+'" alt="Exercise photo preview">':'<span style="width:58px;height:58px;border-radius:16px;background:rgba(214,251,90,.12);color:var(--accent);display:flex;align-items:center;justify-content:center">'+svg('camera',28,1.9)+'</span>')+
      '<span style="font-weight:700;font-size:15px">'+(draft.photo?'Change photo':'Add a form photo')+'</span>'+
      '<span class="mut" style="font-size:12px">Use your camera, or pick from your library</span>'+
      '<input type="file" accept="image/*" capture="environment" data-act="custom-photo" id="photoInput" style="display:none">'+
    '</label>'+
    '<div class="sec">NAME</div><input class="field" id="cname" data-act="custom-name" value="'+esc(draft.name)+'" placeholder="e.g. Half-kneeling Cable Press" aria-label="Exercise name">'+
    '<div class="sec">BODY PART</div><div style="display:flex;flex-wrap:wrap;gap:7px">'+BODY_PARTS.slice(1).map(b=>'<span class="chip '+(draft.body===b?'on':'')+'" data-act="custom-body" data-v="'+b+'">'+b+'</span>').join('')+'</div>'+
    '<div class="sec">EQUIPMENT</div><div style="display:flex;flex-wrap:wrap;gap:7px">'+EQUIP.map(eq=>'<span class="chip '+(draft.equip===eq?'on':'')+'" data-act="custom-equip" data-v="'+eq+'">'+eq+'</span>').join('')+'</div>'+
    '<div class="spread card" style="padding:14px 16px;margin-top:20px"><div><div style="font-weight:700;font-size:14.5px">Unilateral</div><div class="mut" style="font-size:11.5px;margin-top:1px">Track left &amp; right separately</div></div>'+
      '<button class="toggle '+(draft.uni?'on':'')+'" data-act="custom-uni" role="switch" aria-checked="'+draft.uni+'" aria-label="Unilateral"><span class="knob"></span></button></div>'+
    '<div class="sec">TRACK BY</div><div class="seg">'+
      ['weight','time','distance'].map(tb=>'<button class="opt '+(draft.trackBy===tb?'on':'')+'" data-act="custom-track" data-v="'+tb+'">'+({weight:'Weight &amp; reps',time:'Time',distance:'Distance'}[tb])+'</button>').join('')+'</div>'+
    '</div>'+
    '<div class="savebar"><button class="btn btn-accent" data-act="custom-save">Save exercise</button></div>';
}

/* ---------- BODY WEIGHT ---------- */
let bwDraft={kg:'',date:todayDateStr(),photo:null};
function openBW(){bwDraft={kg:'',date:todayDateStr(),photo:null};const ov=document.getElementById('bwOv');ov.innerHTML=bwHTML();ov.classList.remove('hidden');}
function closeBW(){document.getElementById('bwOv').classList.add('hidden');}
function bwHTML(){

    '<div class="ov-body">'+
    '<label class="photo-pick" style="margin-top:6px">'+
      (bwDraft.photo?'<img src="'+bwDraft.photo+'" alt="Progress photo preview">':'<span style="width:58px;height:58px;border-radius:16px;background:rgba(214,251,90,.12);color:var(--accent);display:flex;align-items:center;justify-content:center">'+svg('camera',28,1.9)+'</span>')+
      '<span style="font-weight:700;font-size:15px">'+(bwDraft.photo?'Change progress photo':'Add a progress photo')+'</span>'+

function refreshBW(){

  const ov=document.getElementById('bwOv');ov.innerHTML=bwHTML();

/* ---------- PER-EXERCISE REST ---------- */
let restPick={exId:null,sec:90,typed:''};
function openRestPick(exId){const cur=restForEx(exId);restPick={exId:exId,sec:cur,typed:''};renderRestPick();document.getElementById('restPickOv').classList.remove('hidden');}
function closeRestPick(){document.getElementById('restPickOv').classList.add('hidden');}
function rpTypedSec(){const t=restPick.typed.padStart(4,'0').slice(-4);return parseInt(t.slice(0,2),10)*60+parseInt(t.slice(2),10);}
function rpTypedFmt(){const t=restPick.typed.padStart(4,'0').slice(-4);return t.slice(0,2)+':'+t.slice(2);}
function renderRestPick(){
  const e=exById(restPick.exId)||{name:'Exercise'};
  const presets=[30,45,60,90,120,150,180,240,300];
  const disp=restPick.typed?rpTypedFmt():fmtTime(restPick.sec);
  let h='<div class="ov-head"><button data-act="rp-close" style="background:none;border:none;color:var(--muted);font-weight:600;font-size:15px;cursor:pointer">Cancel</button>'+
    '<div style="font-family:var(--display);font-weight:700;font-size:17px">Rest time</div><span style="width:52px"></span></div>'+
    '<div class="ov-body">'+
    '<div class="mut" style="font-size:13px;line-height:1.5;margin:4px 2px 2px">For <b style="color:var(--fg)">'+esc(e.name)+'</b> — used automatically when you finish a set of it.</div>'+
    '<div class="sec">PRESETS</div><div style="display:flex;flex-wrap:wrap;gap:8px">'+
    presets.map(p=>'<button class="chip '+(!restPick.typed&&restPick.sec===p?'on':'')+'" data-act="rp-preset" data-v="'+p+'">'+fmtTime(p)+'</button>').join('')+'</div>'+
    '<div class="card" style="padding:14px 16px 16px;margin-top:18px">'+
      '<div class="spread" style="margin-bottom:12px"><span class="sec" style="margin:0">TYPE A TIME</span><span class="num" style="font-size:22px;font-weight:700;letter-spacing:.04em">'+disp+'</span></div>'+
      '<div class="keypad">'+
        [1,2,3,4,5,6,7,8,9].map(n=>'<button class="key" data-act="rp-key" data-v="'+n+'">'+n+'</button>').join('')+
        '<button class="key minor" data-act="rp-key" data-v="00">00</button>'+
        '<button class="key" data-act="rp-key" data-v="0">0</button>'+
        '<button class="key minor" data-act="rp-del" aria-label="Delete">⌫</button>'+
      '</div></div>'+
    '<button class="btn btn-accent" data-act="rp-save" style="margin-top:18px">Save rest time</button>'+
    '</div>';
  document.getElementById('restPickOv').innerHTML=h;
}

/* ---------- event handling ---------- */
function closestAct(el){while(el&&el!==document){if(el.dataset&&el.dataset.act)return el;el=el.parentNode;}return null;}

document.addEventListener('click',function(ev){
  const el=closestAct(ev.target);
  if(!el)return;
  const act=el.dataset.act, v=el.dataset.v, id=el.dataset.id;
  const i=el.dataset.i!=null?parseInt(el.dataset.i,10):null;
  const si=el.dataset.s!=null?parseInt(el.dataset.s,10):null;
  switch(act){
    case 'nav': S.view=v; if(v!=='library'){pick.mode=null;} save(); render(); return;
    case 'start-empty': startEmpty(); return;
    case 'resume': S.view='session'; render(); return;
    case 'new-template': askName('New workout','',(name)=>{if(name){const t={id:uid(),name,ex:[]};S.templates.push(t);openTemplateId=t.id;S.view='template';save();render();}}); return;
    case 'open-template': openTemplateId=id;S.view='template';render();return;
    case 'start-template': {const t=S.templates.find(x=>x.id===id);if(t)startTemplate(t);return;}
    // template detail
    case 'tmpl-up': {const t=S.templates.find(x=>x.id===openTemplateId);if(i>0){const a=t.ex;[a[i-1],a[i]]=[a[i],a[i-1]];save();render();}return;}
    case 'tmpl-down': {const t=S.templates.find(x=>x.id===openTemplateId);const a=t.ex;if(i<a.length-1){[a[i+1],a[i]]=[a[i],a[i+1]];save();render();}return;}
    case 'tmpl-del': {const t=S.templates.find(x=>x.id===openTemplateId);t.ex.splice(i,1);save();render();return;}
    case 'tmpl-add': pick.mode='template';pick.targetId=openTemplateId;S.view='library';render();return;
    case 'tmpl-start': {const t=S.templates.find(x=>x.id===openTemplateId);if(t)startTemplate(t);return;}
    case 'tmpl-delete': {S.templates=S.templates.filter(x=>x.id!==openTemplateId);S.view='home';save();render();return;}
    // library
    case 'lib-body': libFilter.body=v;render();return;
    case 'lib-equip': libFilter.equip=libFilter.equip===v?null:v;render();return;
    case 'lib-clear': libFilter.q='';render();setTimeout(()=>{const q=document.getElementById('libq');if(q)q.focus();},30);return;
    case 'pick-cancel': {const back=pick.mode==='template'?'template':'session';pick.mode=null;S.view=back;render();return;}
    case 'lib-pick': {
      if(pick.mode==='session'){addExerciseToSession(id);pick.mode=null;S.view='session';render();toast('Added');}
      else if(pick.mode==='template'){const t=S.templates.find(x=>x.id===pick.targetId);if(t)t.ex.push(id);pick.mode=null;S.view='template';save();render();toast('Added');}
      else {progSel=id;S.view='progress';render();}
      return;
    }
    case 'custom-open': openCustom(); return;
    // session
    case 'sess-finish': finishSession(); return;
    case 'sess-cancel': S.active=null;timer.visible=false;clearInterval(timer.iv);S.view='home';save();render();return;
    case 'sess-add-exercise': pick.mode='session';S.view='library';render();return;
    case 'sess-up': {const a=S.active.items;if(i>0){[a[i-1],a[i]]=[a[i],a[i-1]];save();render();}return;}
    case 'sess-remove': S.active.items.splice(i,1);save();render();return;
    case 'sess-save-template': {const a=S.active;askName('Save as workout',a.name,(name)=>{if(name){S.templates.push({id:uid(),name,ex:a.items.map(x=>x.exId)});save();render();toast('Workout saved');}});return;}
    case 'set-add': {const it=S.active.items[i];const last=it.sets[it.sets.length-1]||blankSet();it.sets.push({kg:last.kg,reps:last.reps,done:false});save();render();return;}
    case 'set-del': {const it=S.active.items[i];if(it.sets.length>1)it.sets.pop();save();render();return;}
    case 'set-done': {const s=S.active.items[i].sets[si];s.done=!s.done;save();render();if(s.done){startRest(restForEx(S.active.items[i].exId));}return;}
    case 'ex-rest': openRestPick(S.active.items[i].exId); return;
    case 'open-timer': openTimer(); return;
    // timer
    case 'timer-close': closeTimer(); return;
    case 'timer-toggle': stopAlarm();timer.done=false;if(timer.remaining<=0){timer.remaining=timer.total;}timer.running=!timer.running;timer.visible=true;if(timer.running){requestNotify();requestWake();timerStartTick();armBackgroundAlarm();}else{clearInterval(timer.iv);releaseWake();disarmBackgroundAlarm();}updateTimerUI();renderRestBar();return;
    case 'timer-reset': stopAlarm();timer.done=false;timer.running=false;clearInterval(timer.iv);timer.remaining=timer.total;releaseWake();disarmBackgroundAlarm();updateTimerUI();renderRestBar();return;
    case 'timer-add15': stopAlarm();timer.done=false;timer.remaining=(timer.remaining||0)+15;timer.total=Math.max(timer.total,timer.remaining);if(timer.running){timerStartTick();armBackgroundAlarm();}updateTimerUI();renderRestBar();return;
    case 'timer-preset': startRest(parseInt(v,10));updateTimerUI();return;
    case 'timer-key': timer.typed=(timer.typed+v).slice(-4);updateTimerUI();return;
    case 'timer-del': timer.typed=timer.typed.slice(0,-1);updateTimerUI();return;
    case 'timer-use': {const sec=typedSeconds();if(sec>0){startRest(sec);timer.typed='';updateTimerUI();}return;}
    case 'rp-close': closeRestPick(); return;
    case 'rp-preset': restPick.sec=parseInt(v,10);restPick.typed='';renderRestPick();return;
    case 'rp-key': restPick.typed=(restPick.typed+v).slice(-4);renderRestPick();return;
    case 'rp-del': restPick.typed=restPick.typed.slice(0,-1);renderRestPick();return;
    case 'rp-save': {const sec=restPick.typed?rpTypedSec():restPick.sec;if(sec>0){S.restByEx=S.restByEx||{};S.restByEx[restPick.exId]=sec;save();}closeRestPick();render();toast('Rest set to '+fmtTime(sec)+' for this exercise');return;}
    case 'rest-toggle': stopAlarm();timer.done=false;timer.running=!timer.running;if(timer.running){if(timer.remaining<=0)timer.remaining=timer.total;requestNotify();requestWake();timerStartTick();armBackgroundAlarm();}else{clearInterval(timer.iv);releaseWake();disarmBackgroundAlarm();}renderRestBar();return;
    case 'rest-open': openTimer(); return;
    case 'rest-dismiss': stopAlarm();timer.visible=false;timer.running=false;timer.done=false;clearInterval(timer.iv);releaseWake();disarmBackgroundAlarm();renderRestBar();return;
    // custom
    case 'custom-close': closeCustom(); return;
    case 'custom-body': draft.body=v;refreshCustom();return;
    case 'custom-equip': draft.equip=v;refreshCustom();return;
    case 'custom-uni': draft.uni=!draft.uni;refreshCustom();return;
    case 'custom-track': draft.trackBy=v;refreshCustom();return;
    case 'custom-save': {
      const nm=(document.getElementById('cname')||{}).value||draft.name;
      if(!nm||!nm.trim()){toast('Give it a name first');return;}
      S.custom=S.custom||[];
      S.custom.push({id:uid(),name:nm.trim(),body:draft.body,equip:draft.equip,uni:draft.uni,trackBy:draft.trackBy,photo:draft.photo,seed:false});
      save();closeCustom();
      if(pick.mode){const nid=S.custom[S.custom.length-1].id;if(pick.mode==='session'){addExerciseToSession(nid);pick.mode=null;S.view='session';}else if(pick.mode==='template'){const t=S.templates.find(x=>x.id===pick.targetId);if(t)t.ex.push(nid);pick.mode=null;S.view='template';}save();}
      render();toast('Exercise created');
      return;
    }
    // name modal
    case 'name-cancel': document.getElementById('nameOv').classList.add('hidden');nameCb=null;return;
    case 'name-ok': {const val=(document.getElementById('nameInput')||{}).value||'';document.getElementById('nameOv').classList.add('hidden');const cb=nameCb;nameCb=null;if(cb)cb(val.trim());return;}
    // settings
    case 'unit': S.unit=v;save();render();return;
    case 'rest': S.defaultRest=parseInt(v,10);save();render();return;
    case 'bw-open': openBW(); return;
    case 'bw-close': closeBW(); return;
    case 'bw-del': S.bodyweight=(S.bodyweight||[]).filter(x=>x.id!==id);save();render();return;
    case 'bw-save': {
      const kgEl=document.getElementById('bwkg');const dEl=document.getElementById('bwdate');
      const raw=kgEl?kgEl.value:bwDraft.kg;const dt=dEl?dEl.value:bwDraft.date;
      const kg=dispToKg(raw);
      if(kg==null){toast('Enter a weight');return;}
      S.bodyweight=S.bodyweight||[];
      S.bodyweight.push({id:uid(),date:(dt||todayDateStr())+'T12:00:00',kg:kg,photo:bwDraft.photo});
      const ok=save();closeBW();render();toast(ok?'Weight logged':'Saved locally, but storage is full — remove old photos');
      return;
    }
    case 'clear-data': askName('Type RESET to confirm','',(val)=>{if((val||'').toUpperCase()==='RESET'){S=defaultState();S.sample=false;S.history=[];S.templates=[];timer.visible=false;save();render();toast('All data cleared');}else{toast('Not cleared');}});return;
  }
});

/* keep draft chips in sync without losing name input focus */
function refreshCustom(){
  const nm=(document.getElementById('cname')||{}).value;if(nm!=null)draft.name=nm;
  const ov=document.getElementById('customOv');const foc=document.activeElement&&document.activeElement.id==='cname';
  ov.innerHTML=customHTML();
  if(foc){const i=document.getElementById('cname');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length);}}
}

/* inputs: set values, search, draft name, progress select */
document.addEventListener('input',function(ev){
  const el=ev.target;const act=el.dataset?el.dataset.act:null;if(!act)return;
  if(act==='set-kg'){const i=+el.dataset.i,si=+el.dataset.s;S.active.items[i].sets[si].kg=el.value===''?null:dispToKg(el.value);save();return;}
  if(act==='set-reps'){const i=+el.dataset.i,si=+el.dataset.s;const r=parseInt(el.value,10);S.active.items[i].sets[si].reps=isNaN(r)?null:r;save();return;}
  if(act==='lib-q'){libFilter.q=el.value;const list=document.querySelectorAll('.exli');/* light re-render */renderLibraryList();return;}
  if(act==='custom-name'){draft.name=el.value;return;}
  if(act==='bw-kg'){bwDraft.kg=el.value;return;}
  if(act==='bw-date'){bwDraft.date=el.value;return;}
  if(act==='tmpl-rename'){const t=S.templates.find(x=>x.id===openTemplateId);if(t){t.name=el.value;save();}return;}
});
document.addEventListener('change',function(ev){
  const el=ev.target;const act=el.dataset?el.dataset.act:null;if(!act)return;
  if(act==='prog-sel'){progSel=el.value;render();return;}
  if(act==='custom-photo'){const f=el.files&&el.files[0];if(f)downscaleImage(f,700,function(d){draft.photo=d;refreshCustom();});return;}
  if(act==='bw-photo'){const f=el.files&&el.files[0];if(f)downscaleImage(f,900,function(d){bwDraft.photo=d;refreshBW();});return;}
});
/* re-render just the library result list on search without losing input focus */
function renderLibraryList(){
  // rebuild only the list area by re-rendering the view but restoring focus/caret
  const q=document.getElementById('libq');const caret=q?q.selectionStart:null;const val=q?q.value:'';
  render();
  const nq=document.getElementById('libq');if(nq){nq.focus();try{nq.setSelectionRange(caret,caret);}catch(e){}}
}

/* ---------- background catch-up: recompute timer when returning to the app ---------- */
document.addEventListener('visibilitychange',function(){
  if(document.visibilityState==='visible'&&timer.running){
    const rem=(timer.endAt-Date.now())/1000;
    timer.remaining=Math.max(0,rem);
    if(rem<=0){timerDone();}else{requestWake();armBackgroundAlarm();}
    updateTimerUI();renderRestBar();
  }
});

/* ---------- boot ---------- */
render();
</script>
